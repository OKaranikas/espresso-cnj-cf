_schema-version: "3.3"
ID: cnj-app
version: 1.0.0
description: Chuck Norris Jokes auf der SAP BTP, Cloud Foundry Environment
provider: Espresso Tutorials

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:

  # --- Datenbank: HDI-Artefakte in den HDI-Container ausliefern ---
  - name: cnj-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: cnj-db
      - name: moderation-service

  # --- CAP-Service auf Node.js ---
  - name: cnj-srv
    type: nodejs
    path: gen/srv
    properties:
      OPTIMIZE_MEMORY: true
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 1024M
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: '${default-url}'
    requires:
      - name: cnj-db
      - name: cnj-auth
      - name: cnj-destination
      - name: cnj-connectivity

  # --- CAP-Service auf Java ---
  - name: cnj-java
    type: java
    path: java/srv
    properties:
      JBP_CONFIG_OPEN_JDK_JRE: '{ jre: { version: 21.+ } }'
      JBP_CONFIG_COMPONENTS: >-
        jres: ["com.sap.xs.java.buildpack.jre.SAPMachineJRE"]
      SPRING_PROFILES_ACTIVE: cloud
    parameters:
      buildpack: sap_java_buildpack_jakarta
      memory: 768M
    build-parameters:
      builder: custom
      commands:
        - mvn -B clean package -DskipTests
      build-result: target/*-exec.jar
    provides:
      - name: java-api
        properties:
          java-url: '${default-url}'
    requires:
      - name: cnj-db
      - name: cnj-auth
      - name: cnj-destination

  # --- Statistikdienst auf Python ---
  - name: cnj-statistik
    type: python
    path: statistik
    parameters:
      buildpack: python_buildpack
      memory: 128M
      command: python server.py
    requires:
      - name: cnj-db
      - name: cnj-auth
    provides:
      - name: statistik-api
        properties:
          statistik-url: '${default-url}'

  # --- Zentrale Komponenten: gemeinsam genutzte externe Bibliotheken ---
  # Aktuell die SAPUI5-Laufzeit: statt dass app/witze/webapp/index.html eine
  # CDN-URL fest verdrahtet, bezieht sie /resources und /test-resources ueber
  # den Application Router von diesem Modul (siehe app/router/xs-app.json).
  # Dasselbe Modul laeuft unveraendert lokal als Express-Middleware
  # (srv/server.js). Details und die zentrale Versionspflege fuer die
  # gemeinsam genutzten Node-Abhaengigkeiten: zentrale-komponenten/README.md.
  - name: cnj-zentrale-komponenten
    type: nodejs
    path: zentrale-komponenten/ui5-proxy
    parameters:
      buildpack: nodejs_buildpack
      memory: 128M
      disk-quota: 256M
    build-parameters:
      builder: custom
      commands:
        # versions.json liegt bewusst eine Ebene ueber dem Modul (einzige
        # Quelle fuer alle Node-Projekte, siehe zentrale-komponenten/README.md)
        # und muss daher vor dem Deployment mit in dieses Modul kopiert werden.
        - cp ../versions.json .
        - npm install --omit=dev
      ignore:
        - test/
    provides:
      - name: ui5-proxy-api
        properties:
          ui5-proxy-url: '${default-url}'

  # --- SAPUI5-Anwendung bauen ---
  - name: cnj-witze-ui
    type: html5
    path: app/witze
    build-parameters:
      builder: custom
      commands:
        # npm ci setzt eine package-lock.json voraus, die das UI-Modul nicht
        # mitliefert - daher npm install.
        - npm install
        - npm run build
      supported-platforms: []
      build-result: dist

  # --- SAPUI5-Anwendung in das HTML5 Application Repository laden ---
  - name: cnj-ui-deployer
    type: com.sap.application.content
    path: gen
    requires:
      - name: cnj-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: app/
      requires:
        # "artifacts" ist ein Dateimuster INNERHALB des build-result-Ordners
        # (app/witze/dist), kein Auftrag, diesen Ordner zu packen. Der Name
        # muss daher zum archiveName des ui5-task-zipper passen.
        - name: cnj-witze-ui
          artifacts:
            - cnj-witze-ui.zip
          target-path: app/

  # --- Application Router als Einstiegspunkt ---
  - name: cnj-app
    type: approuter.nodejs
    path: app/router
    parameters:
      memory: 256M
      disk-quota: 512M
    deployed-after:
      - cnj-srv
      - cnj-statistik
      - cnj-zentrale-komponenten
      - cnj-ui-deployer
    requires:
      - name: cnj-auth
      - name: cnj-html5-repo-runtime
      - name: cnj-destination
      - name: srv-api
        group: destinations
        properties:
          name: cnj-srv-api
          url: '~{srv-url}'
          forwardAuthToken: true
      - name: statistik-api
        group: destinations
        properties:
          name: cnj-statistik-api
          url: '~{statistik-url}'
          forwardAuthToken: true
      - name: ui5-proxy-api
        group: destinations
        properties:
          name: cnj-ui5-proxy-api
          url: '~{ui5-proxy-url}'
          forwardAuthToken: false

resources:

  - name: cnj-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-container-name: '${service-name}'

  - name: cnj-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: cnj-app-${space}
        tenant-mode: dedicated

  - name: moderation-service
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: moderation-service

  - name: cnj-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: cnj-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite

  - name: cnj-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: cnj-html5-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
