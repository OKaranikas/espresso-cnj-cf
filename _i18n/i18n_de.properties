TextInfo = Der Witz selbst. Ein neuer Witz ist mit einem Vorschlag der Chuck-Norris-API vorbelegt; sobald Sie ihn ändern, gilt er als eigener Witz.
BewertungInfo = Wie lustig ist der Witz? 0 bis 5 Sterne. Im Filter lassen sich Sternestufen auswählen oder Bedingungen wie „mindestens 3 Sterne“ festlegen.
KategorieInfo = Thema des Witzes. Vorschläge der API übernehmen deren Kategorie, sofern es sie hier gibt.
KategorieOptional = Kategorie (optional, sonst zufällig)
QuelleInfo = Woher der Witz stammt. Bekannte Quelle auswählen oder neuen Namen eingeben – er wird beim Sichern angelegt. Wer einen API-Witz ändert, wechselt die Quelle auf „Redaktion“.
ApiId = API-ID
ApiIdInfo = Kennung des Witzes bei api.chucknorris.io. Verhindert, dass derselbe Witz doppelt gespeichert wird.
FacetWitz = Witz & Bewertung
FacetHerkunft = Herkunft
VorschlagLaden = Witz von der API laden
Bewertungsstufen = Sternestufen
Sterne = Sterne
Beschreibung = Beschreibung
EingetragenVon = Eingetragen von
EingetragenVonInfo = Benutzer, der den Witz in die Sammlung aufgenommen hat.
FacetVerlauf = Verlauf
QuelleUrl = Website
